name: Render Video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nama folder video di public/ (contoh: video1)"
        required: true
        default: "video1"
      scale:
        description: "Skala render: 1 = 1080x1920, 0.667 = 720x1280 (lebih cepat)"
        required: true
        default: "0.667"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang ffmpeg (binary statis, cepat)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Pasang numpy/scipy
        run: pip install numpy scipy

      - name: Pasang dependensi npm
        run: npm install --no-audit --no-fund

      - name: Cache browser Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validasi scenes.src.json + keberadaan mp3/srt (berhenti bila ada kesalahan)
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/validate_scenes.py "$VIDEO"

      # Hanya berguna untuk style lama (gambar emoji); tidak boleh menggagalkan render
      - name: Unduh gambar objek (visuals)
        continue-on-error: true
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/visualize.py "$VIDEO"

      - name: Siapkan (timing dari SRT, lip-sync, musik di-duck, SFX)
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/prepare.py "$VIDEO"

      - name: Render
        env:
          VIDEO: ${{ github.event.inputs.video }}
          SCALE: ${{ github.event.inputs.scale }}
        run: |
          mkdir -p out
          echo "{\"name\":\"$VIDEO\"}" > props.json
          npx remotion render src/index.ts Cerita "out/$VIDEO.mp4" \
            --props=props.json --crf=23 --scale="$SCALE" \
            --concurrency=$(nproc) --log=verbose

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}
          path: out/*.mp4
          retention-days: 7
