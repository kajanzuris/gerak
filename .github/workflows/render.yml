name: Render Video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nama folder video di public/ (contoh: video1)"
        required: true
        default: "video1"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang ffmpeg (binary statis, cepat)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Pasang numpy/scipy
        run: pip install numpy scipy

      - name: Pasang dependensi npm
        run: npm ci

      - name: Cache browser Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validasi scenes.src.json (berhenti bila ada kesalahan)
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/validate_scenes.py "$VIDEO"

      - name: Unduh gambar objek (kucing, ikan, dst. dari "visuals")
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/visualize.py "$VIDEO"

      - name: Siapkan (timing dari SRT, lip-sync, musik di-duck, SFX)
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/prepare.py "$VIDEO"

      - name: Render
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: |
          mkdir -p out
          echo "{\"name\":\"$VIDEO\"}" > props.json
          npx remotion render src/index.ts Cerita "out/$VIDEO.mp4" \
            --props=props.json --crf=23 --concurrency=2 --log=verbose

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}
          path: out/*.mp4
